<div class="vlt-upload-bounding-box" id="drop-zone-container">
  <!-- Hidden native file channel -->
  <input type="file" id="raw-file-input" class="vlt-hidden-file-input" multiple />

  <div class="vlt-upload-content-layout">
    <!-- Visual cloud upload vector icon graphic placeholder -->
    <svg class="vlt-upload-cloud-icon" xmlns="http://w3.org" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
      stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z" />
    </svg>

    <p class="vlt-upload-main-instruction">
      <span class="vlt-upload-highlight-text">Click to browse files</span> or drag and drop files here
    </p>
    <p class="vlt-upload-sub-text">Supports PDF, PNG, JPG, or ZIP (Max 10MB)</p>
  </div>
</div>

<!-- Dynamic files output feed list panel -->
<ul class="vlt-file-tracker-feed" id="file-output-feed-list"></ul>
