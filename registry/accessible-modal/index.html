<!-- Trigger Element -->
<button class="vlt-btn-trigger" data-modal-target="sample-modal" type="button">
  Open System Dialog
</button>

<!-- Native HTML5 Dialog Framework -->
<dialog class="vlt-dialog-box" id="sample-modal">
  <div class="vlt-dialog-content">
    <header class="vlt-dialog-header">
      <h2 class="vlt-dialog-title">System Update Notification</h2>
      <button class="vlt-dialog-close-btn" aria-label="Close modal dialog">&times;</button>
    </header>
    <main class="vlt-dialog-body">
      <p>Your component database configurations have been processed cleanly. All asset streams are operational.</p>
    </main>
    <footer class="vlt-dialog-footer">
      <button class="vlt-btn-flat vlt-dialog-close-action">Dismiss</button>
      <button class="vlt-btn-solid">Proceed</button>
    </footer>
  </div>
</dialog>
