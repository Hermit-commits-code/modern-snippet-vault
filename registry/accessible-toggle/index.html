<label class="vlt-switch-label" for="mode-toggle">
  <!-- Native semantic input handler -->
  <input type="checkbox" id="mode-toggle" class="vlt-switch-checkbox" role="switch" aria-checked="false" />
  <!-- Styled presentational track track container layout -->
  <span class="vlt-switch-track">
    <span class="vlt-switch-thumb"></span>
  </span>
  <span class="vlt-switch-text">Enable Dark Preference</span>
</label>
