<div class="vlt-wizard-wrapper">
  <!-- The Progress Timeline Bar Area -->
  <div class="vlt-progress-timeline-container">
    <div class="vlt-progress-timeline-line" id="timeline-indicator-wire"></div>

    <div class="vlt-timeline-step active" data-step="1">1</div>
    <div class="vlt-timeline-step" data-step="2">2</div>
    <div class="vlt-timeline-step" data-step="3">3</div>
    <div class="vlt-timeline-step" data-step="4">4</div>
  </div>

  <!-- Micro Interaction Navigation Controls -->
  <div class="vlt-wizard-controls-row">
    <button class="vlt-wizard-nav-btn" id="prev-step-btn" disabled type="button">Back</button>
    <button class="vlt-wizard-nav-btn primary" id="next-step-btn" type="button">Next Step</button>
  </div>
</div>
