<!-- We manage states directly on this parent wrapper element -->
<div class="vlt-theme-card" id="theme-card-wrapper">
  <div class="vlt-theme-card-header">
    <h3 class="vlt-theme-card-title">System Theme Controller</h3>
    <button class="vlt-theme-toggle-btn" id="theme-switcher-action" aria-label="Toggle dark and light color themes">
      <span class="vlt-mode-icon-sun">☀️ Light Mode</span>
      <span class="vlt-mode-icon-moon">🌙 Dark Mode</span>
    </button>
  </div>
  <p class="vlt-theme-card-body">This panel changes its color scheme dynamically based on your system preferences or
    manually using the theme controller button above.</p>
</div>
